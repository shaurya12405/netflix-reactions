name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Install whatever PostgreSQL major version this Ubuntu ships, plus the
      # matching pgTAP, so runner image upgrades don't break the job.
      - name: Install PostgreSQL and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libtap-parser-sourcehandler-pgtap-perl
          PG_MAJOR="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          echo "PostgreSQL $PG_MAJOR"
          sudo apt-get install -y "postgresql-$PG_MAJOR-pgtap"
      - run: ./scripts/test-db.sh

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts/*.png
