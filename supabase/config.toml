# Minimal Supabase CLI config, used by `supabase link`, `supabase db push`,
# `supabase functions deploy` and the optional local stack (`supabase start`).
project_id = "scene-talk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

# The function verifies the caller's JWT itself (works with new signing keys).
[functions.post-comment]
verify_jwt = false
